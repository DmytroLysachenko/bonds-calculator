name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: HUSKY=0 pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: HUSKY=0 pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check:types

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Contract discovery
        run: pnpm check:test-discovery

      - name: Unused code scan
        run: pnpm scan:unused

      - name: Release tests
        run: pnpm test:release

      - name: Node server boundary tests
        run: pnpm test:server

      - name: Trusted-core evidence
        run: pnpm test:trusted-core

      - name: Measured coverage threshold
        run: pnpm test:coverage

      - name: Quality summary
        if: always()
        run: |
          {
            echo "### Quality checks"
            echo ""
            echo "- TypeScript: \`pnpm check:types\`"
            echo "- Lint: \`pnpm lint\`"
            echo "- Formatting: \`pnpm format:check\`"
            echo "- Release tests: \`pnpm test:release\`"
            echo "- Trusted core: \`pnpm test:trusted-core\`"
            echo "- Coverage: \`pnpm test:coverage\` (70% per aggregate metric)"
          } >> "${GITHUB_STEP_SUMMARY}"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: HUSKY=0 pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Report route bundles
        run: pnpm analyze:bundles

      - name: Enforce route bundle budgets
        run: pnpm check:bundle-budgets

      - name: Retain route bundle report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: route-bundle-report
          path: artifacts/route-bundle-report.json
          if-no-files-found: error

      - name: Build summary
        if: always()
        run: |
          {
            echo "### Build"
            echo ""
            echo "- Production build: \`pnpm build\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: obligacje
          POSTGRES_PASSWORD: obligacje
          POSTGRES_DB: obligacje_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U obligacje -d obligacje_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://obligacje:obligacje@127.0.0.1:5432/obligacje_test
      TEST_DATABASE_URL: postgresql://obligacje:obligacje@127.0.0.1:5432/obligacje_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: HUSKY=0 pnpm install --frozen-lockfile

      - name: Enable UUID extension required by reviewed schema
        run: PGPASSWORD=obligacje psql -h 127.0.0.1 -U obligacje -d obligacje_test -c 'CREATE EXTENSION IF NOT EXISTS pgcrypto;'

      - name: Verify migrated PostgreSQL constraints and rollback
        run: pnpm test:db --reporter=json --outputFile=artifacts/database-integration.json

      - name: Install authenticated browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Authenticated portfolio ownership and mutation workflow
        run: pnpm test:browser:integration --workers=1

      - name: Upload database integration result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: database-integration-result
          path: artifacts/database-integration.json
          if-no-files-found: error

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install script dependencies
        run: HUSKY=0 pnpm install --frozen-lockfile

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          load: true
          tags: obligacje-calculator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan production image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: obligacje-calculator:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Start production image
        run: |
          docker run --detach --name obligacje-calculator-ci \
            --publish 8080:8080 \
            --env AUTH_SECRET=ci-development-auth-secret-change-me \
            --env SYNC_SECRET=ci-development-sync-secret-change-me \
            --env NEXT_PUBLIC_APP_URL=http://127.0.0.1:8080 \
            --env AUTH_TRUST_HOST=true \
            --env PLAYWRIGHT_SMOKE=1 \
            --env NEXT_PUBLIC_PLAYWRIGHT_SMOKE=1 \
            obligacje-calculator:ci

      - name: Smoke production image
        run: pnpm smoke:local -- --base-url http://127.0.0.1:8080 --check-content-type

      - name: Print container logs
        if: failure()
        run: docker logs obligacje-calculator-ci

      - name: Stop production image
        if: always()
        run: docker rm --force obligacje-calculator-ci || true

      - name: Docker build summary
        if: always()
        run: |
          {
            echo "### Docker build"
            echo ""
            echo "- Production image: \`docker/build-push-action\`"
            echo "- Image scan: Trivy fails on fixable high/critical OS or library vulnerabilities"
            echo "- Production smoke: \`pnpm smoke:local -- --base-url http://127.0.0.1:8080 --check-content-type\`"
            echo "- Push: disabled"
          } >> "${GITHUB_STEP_SUMMARY}"

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLAYWRIGHT_SMOKE: '1'
      NEXT_PUBLIC_PLAYWRIGHT_SMOKE: '1'
      NEXT_PUBLIC_DEPLOYMENT_TIER: production
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: HUSKY=0 pnpm install --frozen-lockfile

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser environment preflight
        run: pnpm check:local-env -- --require-playwright

      - name: Build
        run: pnpm build

      - name: Browser smoke, trusted-core journeys, accessibility, and web vitals
        run: pnpm test:browser:ci && pnpm test:trusted-core:browser && pnpm test:a11y && pnpm test:browser:visual

      - name: Populated strict-CSP calculator interaction
        run: pnpm test:browser:strict-csp

      - name: Lighthouse quality gate
        run: pnpm test:lighthouse

      - name: Summarize Lighthouse routes
        if: always()
        run: pnpm analyze:lighthouse

      - name: Publish Lighthouse summary
        if: always()
        run: cat artifacts/lighthouse-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Lighthouse summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lighthouse-route-summary
          path: |
            artifacts/lighthouse-summary.json
            artifacts/lighthouse-summary.md
          if-no-files-found: ignore

      - name: Upload browser reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-smoke-report
          path: |
            playwright-report
            test-results
            .lighthouseci
            artifacts/lighthouse-summary.json
            artifacts/lighthouse-summary.md
          if-no-files-found: ignore

  browser-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_SMOKE: '1'
      NEXT_PUBLIC_PLAYWRIGHT_SMOKE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Enable Corepack
        run: corepack enable
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: HUSKY=0 pnpm install --frozen-lockfile
      - name: Install Firefox and WebKit
        run: pnpm exec playwright install --with-deps firefox webkit
      - name: Build
        run: pnpm build
      - name: Cross-browser smoke and accessibility
        run: pnpm test:browser:matrix

      - name: Firefox strict-CSP calculator regression
        run: pnpm test:browser:firefox-csp

      - name: Populated strict-CSP calculator matrix
        run: pnpm exec playwright test tests/browser/strict-csp-interactions.spec.ts tests/browser/issue-explorer.spec.ts --project=firefox-csp --project=webkit-csp --workers=1

      - name: Browser smoke summary
        if: always()
        run: |
          {
            echo "### Browser smoke"
            echo ""
            echo "- Routes: home, education, single calculator, comparison, economic data"
            echo "- Checks: title, main landmark, navigation label, axe WCAG 2.2 AA, console/page errors, failed requests, 5xx responses"
            echo "- Lighthouse: accessibility, best practices, SEO, LCP, and CLS"
            echo "- Diagnostics: browser-diagnostics attachment and Playwright trace on failure"
            echo "- Browser gate: \`pnpm test:browser:ci\` plus committed Chromium visual baselines"
          } >> "${GITHUB_STEP_SUMMARY}"
